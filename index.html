<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FuturePath Five-Year Plan</title>
<style>
:root{--a:#e87524;--p:#fff0e4;--ink:#213047;--muted:#657287;--bg:#eef2f7;--line:#dce3ec}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:275px 1fr;min-height:100vh}.side{background:#172437;color:#fff;padding:22px 17px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;margin-bottom:22px}.logo{width:45px;height:45px;border-radius:13px;background:var(--a);display:grid;place-items:center;font-size:23px;font-weight:800}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:#bdc8d8;margin:3px 0}
nav{display:grid;gap:7px}nav button{border:0;border-radius:10px;padding:11px;text-align:left;background:transparent;color:#dce5f2}nav button.active{background:var(--a);color:#fff}
.note{font-size:12px;line-height:1.45;color:#bdc8d8;border-top:1px solid #35445a;margin-top:20px;padding-top:15px}
main{padding:24px;max-width:1220px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--a);margin:0 0 4px}.top h2{margin:0}.prog{min-width:260px}.prow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}.track{height:9px;border-radius:99px;background:#d9e0e9;overflow:hidden}.bar{height:100%;background:var(--a)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:27px;box-shadow:0 12px 28px rgba(25,39,60,.08)}.intro{background:linear-gradient(135deg,var(--p),#fff);border-radius:15px;padding:19px;margin-bottom:21px}.intro h3{margin:0 0 7px}.intro p{margin:0;line-height:1.5;color:#4f5d70}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{display:grid;gap:7px;margin-bottom:15px}.field label,.st{font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd4df;border-radius:10px;background:#fff}.field textarea{min-height:110px}
.section{margin:23px 0}.st{font-size:18px;margin-bottom:5px}.hint{font-size:13px;color:var(--muted);margin:0 0 11px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice label{display:block;border:2px solid var(--line);border-radius:11px;padding:11px;background:#fff;min-height:47px}.choice input:checked+label{border-color:var(--a);background:var(--p);font-weight:700}.other{margin-top:10px}
.help{border:1px dashed #f0a46f;background:#fff9f4;border-radius:11px;padding:13px;margin-top:9px}.help summary{font-weight:700;color:#aa4e0c}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.chip{border:1px solid #efbd97;background:#fff;border-radius:999px;padding:7px 10px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:17px}.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:700}.primary{background:var(--a);color:#fff}.secondary{background:#e6ebf1}.danger{background:#fff0f0;color:#a82222;border:1px solid #efcaca}
.timeline{display:grid;gap:11px}.trow{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:13px}.trow small{display:block;color:var(--muted);margin-top:3px}.years{display:flex;gap:5px;flex-wrap:wrap}.yb input{position:absolute;opacity:0}.yb label{display:grid;place-items:center;width:54px;height:40px;border:2px solid var(--line);border-radius:8px;font-weight:700}.yb input:checked+label{background:var(--a);border-color:var(--a);color:#fff}
.review{display:grid;grid-template-columns:1fr 1fr;gap:13px}.rcard,.yplan{border:1px solid var(--line);border-radius:13px;padding:15px}.rcard h4{margin:0 0 7px;color:var(--a)}.rcard p{margin:4px 0;line-height:1.45}.yplan{margin-bottom:16px}.yplan h3{margin-top:0}.keys{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 14px}.key{background:var(--p);border:1px solid #efbd97;border-radius:999px;padding:7px 10px;font-size:13px}.plantext{min-height:145px;width:100%;padding:12px;border:1px solid #cbd4df;border-radius:10px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.theme input{position:absolute;opacity:0}.theme label{display:block;border:2px solid var(--line);border-radius:11px;padding:13px;text-align:center}.theme input:checked+label{border-color:var(--a);background:var(--p)}
.uploads{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.upload{border:1px solid var(--line);border-radius:11px;padding:12px}.upload img{max-width:100%;max-height:150px;border-radius:9px;margin-top:9px}
.flash{display:none;background:#eaf7ed;border:1px solid #b8ddc0;color:#245f30;border-radius:9px;padding:9px;margin-bottom:13px}
body.blue{--a:#2563b5;--p:#eaf2ff}body.green{--a:#2f7c4b;--p:#e9f7ee}body.purple{--a:#7653b5;--p:#f1ecfb}body.orange{--a:#e87524;--p:#fff0e4}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto}nav{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.prog{width:100%}.choices,.grid2,.grid3,.review,.themes,.uploads{grid-template-columns:1fr 1fr}.trow{grid-template-columns:1fr}}
@media(max-width:560px){nav,.choices,.grid2,.grid3,.review,.themes,.uploads{grid-template-columns:1fr}main{padding:12px}.card{padding:18px}}
@media print{.side,.top,.actions,.no-print{display:none!important}.app{display:block}main{padding:0;max-width:none}.card{box-shadow:none;border:0}.print-page{page-break-after:always;min-height:9in;padding:.4in}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><div class="logo">5</div><div><h1>FuturePath</h1><p>Five-Year Plan Builder</p></div></div><nav id="nav"></nav><div class="note">Answers save automatically in this browser. Download saved answers before switching computers.</div></aside>
<main><header class="top"><div><p class="eyebrow" id="eye"></p><h2 id="title"></h2></div><div class="prog"><div class="prow"><span id="step"></span><span id="pct"></span></div><div class="track"><div class="bar" id="bar"></div></div></div></header><div class="flash" id="flash"></div><section class="card" id="content"></section><div class="actions"><button class="btn secondary" id="back">Back</button><div><button class="btn danger" id="reset">Start Over</button> <button class="btn primary" id="next">Next</button></div></div></main></div>
<script>
const STORE="futurePathV3";
const steps=[
["Home","WELCOME","FuturePath Five-Year Plan"],
["Start & Personal Goals","START HERE","Start My Plan"],
["Strengths & Growth","ABOUT ME","My Strengths & Growth"],
["My Five-Year Vision","LOOKING AHEAD","My Five-Year Vision"],
["Career & Training","CAREER PATH","Career & Training"],
["Supports & Living","INDEPENDENCE","Supports & Independent Living"],
["Timeline","MY ROADMAP","Place My Goals Across Five Years"],
["Check It","REVIEW","Check My Choices"],
["My Plan","WRITE MY PLAN","My Five-Year Plan"],
["Customize & Download","MAKE IT MINE","Customize & Download"]];
const O={
personal:["Have a pet","Travel somewhere new","Have a boyfriend, girlfriend, or significant other","Get married","Have a child or family","Make new friends","Spend more time with friends","Join a club, team, group, or community activity","Learn to play an instrument","Learn another language","Learn to cook","Improve my health or fitness","Volunteer","Develop a hobby","Become more confident","Become more independent","I am not sure yet"],
strengths:["Working with my hands","Working with words","Working with numbers","Working independently","Working with a team","Helping people","Working with children","Working with older adults","Paying attention to details","Being creative","Being dependable","Being patient","Being empathetic","Solving problems","Being flexible","Communicating","Following directions","Technology"],
growth:["Speaking up for myself","Managing my time","Staying organized","Handling stress","Asking for help","Following directions","Completing tasks","Working with others","Communicating","Managing money","Using transportation","Cooking","Cleaning","Making appointments","Problem solving"],
vision:["Working full time","Working part time","Attending a four-year university","Attending community college","Attending trade or technical school","Completing a certificate program","Serving in the military","Completing an apprenticeship","Receiving on-the-job training","Volunteering","Owning a business","Still exploring"],
career:["Agriculture, Food & Nature","Building, Construction & Repair","Art, Media & Communication","Business & Office Work","Education & Child Care","Money & Banking","Government & Public Service","Health & Medical","Hotels, Restaurants & Travel","Helping & Personal Services","Computers & Technology","Law & Public Safety","Making & Manufacturing","Marketing & Sales","Science & Engineering","Transportation & Delivery"],
training:["Four-year university","Community college","Technical or trade school","Certificate program","Apprenticeship","On-the-job training","Military training","Mentor","Job coach","I am not sure yet"],
help:["Family","Teacher","School counselor","Mentor","Job coach","Vocational Rehabilitation counselor","Tutor","College disability services","Coworker or supervisor","Transportation support"],
living:["Live with family","College dorm","Apartment alone","Apartment with a roommate","Supported living","Own a home","I am not sure yet"],
transport:["Drive my own car","Ride with family or friends","Public transportation","Walk or bicycle","Taxi or ride service","Transportation support","I am not sure yet"],
money:["Open a bank account","Learn to make a budget","Save money","Pay my own bills","Build credit","Save for a car","Save for housing","I am not sure yet"],
independent:["Cook meals","Shop for groceries","Clean my home","Do laundry","Manage medicine","Make appointments","Use transportation","Stay safe in the community","Manage my schedule","Ask for help when needed"]};
const D={studentName:"",grade:"",gradYear:new Date().getFullYear()+1,personalGoals:[],personalOther:"",personalWhy:"",strengths:[],strengthsOther:"",growth:[],growthOther:"",vision:[],visionOther:"",careerAreas:[],careerAreasOther:"",careerChoice:"",training:[],trainingOther:"",trainingHelp:[],trainingHelpOther:"",living:[],livingOther:"",transport:[],transportOther:"",money:[],moneyOther:"",independent:[],independentOther:"",supports:[],supportsOther:"",timeline:{},yearWriting:["","","","",""],theme:"orange",decoration:"clean",images:{headshot:"",dream:"",career:"",year1:"",year2:"",year3:"",year4:"",year5:""}};
let S;try{S=Object.assign(structuredClone(D),JSON.parse(localStorage.getItem(STORE)||"{}"));S.images=Object.assign({},D.images,S.images||{});S.timeline=S.timeline||{};S.yearWriting=[0,1,2,3,4].map(i=>(S.yearWriting||[])[i]||"")}catch(e){S=structuredClone(D)}let cur=Number(localStorage.getItem(STORE+"Step")||0); if(cur<0||cur>=steps.length)cur=0;
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)],esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(STORE,JSON.stringify(S));localStorage.setItem(STORE+"Step",cur)}
function flash(t){$("#flash").textContent=t;$("#flash").style.display="block";setTimeout(()=>$("#flash").style.display="none",2200)}
function group(path,items,sel){return `<div class="choices">${items.map((x,i)=>`<div class="choice"><input id="${path}${i}" type="checkbox" data-array="${path}" value="${esc(x)}" ${(sel||[]).includes(x)?"checked":""}><label for="${path}${i}">${esc(x)}</label></div>`).join("")}</div>`}
function other(path,val,ph="Type another choice"){return `<div class="field other"><label>Other</label><input data-field="${path}" value="${esc(val)}" placeholder="${esc(ph)}"></div>`}
function help(path,ideas){return `<details class="help"><summary>Need Help Getting Started?</summary><div class="chips">${ideas.map(x=>`<button type="button" class="chip" data-fill="${path}" data-text="${esc(x)}">${esc(x)}</button>`).join("")}</div></details>`}
function all(a,o){return [...(a||[]),...(o&&String(o).trim()?[String(o).trim()]:[])]}
function render(){document.body.className=S.theme;$("#nav").innerHTML=steps.map((s,i)=>`<button data-step="${i}" class="${i===cur?"active":""}">${i+1}. ${s[0]}</button>`).join("");$("#eye").textContent=steps[cur][1];$("#title").textContent=steps[cur][2];$("#step").textContent=`Step ${cur+1} of ${steps.length}`;let p=Math.round((cur+1)/steps.length*100);$("#pct").textContent=p+"% complete";$("#bar").style.width=p+"%";$("#back").disabled=cur===0;$("#next").textContent=cur===steps.length-1?"Save Progress":"Next";$("#content").innerHTML=page(cur);bind()}
function page(i){
if(i===0)return `<div class="intro" style="text-align:center;padding:42px 24px"><h1 style="font-size:42px;margin:0 0 14px;color:var(--a)">FuturePath</h1><h2 style="font-size:28px;margin:0 0 14px">Build Your Five-Year Plan</h2><p style="font-size:18px;max-width:720px;margin:0 auto 24px;line-height:1.6">Think about your future, choose your goals, organize them across five years, and create a plan in your own words.</p><button type="button" class="btn primary" id="startHome" style="font-size:18px;padding:14px 24px">Start My Plan</button></div><div class="review"><div class="rcard"><h4>1. Choose</h4><p>Select goals, strengths, career ideas, education, supports, and independent-living skills.</p></div><div class="rcard"><h4>2. Organize</h4><p>Place each goal into one or more years on your timeline.</p></div><div class="rcard"><h4>3. Write</h4><p>Use your selected keywords to explain each year in your own words.</p></div><div class="rcard"><h4>4. Create</h4><p>Add pictures and a theme, then download or print your finished plan.</p></div></div>`;
if(i===8)return `<div class="intro"><h3>Let’s build a plan that sounds like you.</h3><p>Choose ideas, write a few short answers, and organize your goals across five years.</p></div><div class="grid3"><div class="field"><label>Your name</label><input data-field="studentName" value="${esc(S.studentName)}"></div><div class="field"><label>Current grade</label><select data-field="grade"><option value="">Choose</option>${[9,10,11,12].map(x=>`<option ${String(S.grade)===String(x)?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Expected graduation year</label><input type="number" data-field="gradYear" value="${esc(S.gradYear)}"></div></div><div class="section"><div class="st">My Personal Goals</div><p class="hint">Choose all that matter to you.</p>${group("personalGoals",O.personal,S.personalGoals)}${other("personalOther",S.personalOther,"Another personal goal")}</div><div class="field"><label>Why are these goals important to you?</label><textarea data-field="personalWhy">${esc(S.personalWhy)}</textarea>${help("personalWhy",["These goals will help me become more independent.","These goals would make me happy and help me grow.","These goals are part of the life I want after high school."])}</div>`;
if(i===8)return `<div class="intro"><h3>What are you good at, and what would you like to improve?</h3><p>Choose your answers without writing an extra story.</p></div><div class="section"><div class="st">My Strengths</div><p class="hint">Choose up to five.</p>${group("strengths",O.strengths,S.strengths)}${other("strengthsOther",S.strengthsOther,"Another strength")}</div><div class="section"><div class="st">Areas I Want to Improve</div>${group("growth",O.growth,S.growth)}${other("growthOther",S.growthOther,"Another area")}</div>`;
if(i===8)return `<div class="intro"><h3>What might you be doing five years from now?</h3><p>Choose every answer that could be part of your future.</p></div>${group("vision",O.vision,S.vision)}${other("visionOther",S.visionOther,"Something else I may be doing")}`;
if(i===8)return `<div class="section"><div class="st">Career areas I may want to explore</div>${group("careerAreas",O.career,S.careerAreas)}${other("careerAreasOther",S.careerAreasOther,"Another career area")}</div><div class="field"><label>What specific job or career would you like to have?</label><input data-field="careerChoice" value="${esc(S.careerChoice)}" placeholder="Example: veterinary assistant">${help("careerChoice",["Veterinary assistant","Auto mechanic","Welder","Teacher assistant","Nurse","Computer support specialist","Chef or cook","Cashier or customer service worker"])}</div><div class="section"><div class="st">Education or training I may need</div>${group("training",O.training,S.training)}${other("trainingOther",S.trainingOther,"Another type of training")}</div><div class="section"><div class="st">Help I may need</div>${group("trainingHelp",O.help,S.trainingHelp)}${other("trainingHelpOther",S.trainingHelpOther,"Another person or service")}</div>`;
if(i===8)return `<div class="section"><div class="st">Where I may live</div>${group("living",O.living,S.living)}${other("livingOther",S.livingOther)}</div><div class="section"><div class="st">How I may get around</div>${group("transport",O.transport,S.transport)}${other("transportOther",S.transportOther)}</div><div class="section"><div class="st">Money skills and goals</div>${group("money",O.money,S.money)}${other("moneyOther",S.moneyOther)}</div><div class="section"><div class="st">Independent living skills</div>${group("independent",O.independent,S.independent)}${other("independentOther",S.independentOther)}</div><div class="section"><div class="st">People or services that may support me</div>${group("supports",O.help,S.supports)}${other("supportsOther",S.supportsOther)}</div>`;
if(i===5){let it=items();return `<div class="intro"><h3>Choose every year that applies.</h3><p>An activity can appear in more than one year.</p></div><div class="timeline">${it.length?it.map(row).join(""):"<p>Please make choices on earlier pages first.</p>"}</div>`}
if(i===8)return `<div class="intro"><h3>Here is what you selected.</h3><p>Only your choices appear below.</p></div><div class="review">${cards()}</div><div class="section"><div class="st">Timeline by Year</div>${summary()}</div>`;
if(i===8)return `<div class="intro"><h3>Use the ideas above each box to write your plan in your own words.</h3><p>The keywords help you remember what you chose.</p></div>${[1,2,3,4,5].map(yearPlan).join("")}`;
return `<div class="intro"><h3>Make your finished plan feel like yours.</h3><p>Choose a theme, add optional pictures, and download a polished copy.</p></div><div class="section"><div class="st">Color Theme</div><div class="themes">${["orange","blue","green","purple"].map(t=>`<div class="theme"><input id="t${t}" type="radio" name="theme" value="${t}" ${S.theme===t?"checked":""}><label for="t${t}">${t[0].toUpperCase()+t.slice(1)}</label></div>`).join("")}</div></div><div class="section"><div class="st">Decoration Style</div><div class="themes">${["clean","stars","path","confetti"].map(t=>`<div class="theme"><input id="d${t}" type="radio" name="dec" value="${t}" ${S.decoration===t?"checked":""}><label for="d${t}">${t[0].toUpperCase()+t.slice(1)}</label></div>`).join("")}</div></div><div class="section"><div class="st">Pictures</div><div class="uploads">${upload("headshot","Student photo")}${upload("dream","Dream picture")}${upload("career","Career picture")}${[1,2,3,4,5].map(y=>upload("year"+y,"Year "+y+" picture")).join("")}</div></div><div class="section"><button class="btn primary" id="print">Print / Save PDF</button> <button class="btn secondary" id="html">Download Finished HTML</button> <button class="btn secondary" id="data">Download Saved Answers</button></div><p class="hint">Avoid entering confidential student information while testing on a public GitHub site.</p>`;
}
function items(){let g=[["Personal Goal",all(S.personalGoals,S.personalOther)],["Strength",all(S.strengths,S.strengthsOther)],["Growth Area",all(S.growth,S.growthOther)],["Five-Year Vision",all(S.vision,S.visionOther)],["Career Area",all(S.careerAreas,S.careerAreasOther)],["Career",S.careerChoice?[S.careerChoice]:[]],["Education & Training",all(S.training,S.trainingOther)],["Career Support",all(S.trainingHelp,S.trainingHelpOther)],["Living",all(S.living,S.livingOther)],["Transportation",all(S.transport,S.transportOther)],["Money",all(S.money,S.moneyOther)],["Independent Living",all(S.independent,S.independentOther)],["Support",all(S.supports,S.supportsOther)]],out=[];g.forEach(([c,a])=>a.forEach(t=>{if(t&&t!=="I am not sure yet")out.push({id:c+"::"+t,cat:c,text:t})}));return out}
function safe(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return "x"+(h>>>0).toString(36)}
function row(o){let ys=S.timeline[o.id]||[];return `<div class="trow"><div><strong>${esc(o.text)}</strong><small>${esc(o.cat)}</small></div><div class="years">${[1,2,3,4,5].map(y=>`<div class="yb"><input id="${safe(o.id)}${y}" type="checkbox" data-time="${esc(o.id)}" value="${y}" ${ys.includes(y)?"checked":""}><label for="${safe(o.id)}${y}">Yr ${y}</label></div>`).join("")}</div></div>`}
function cards(){let c=[["Personal Goals",all(S.personalGoals,S.personalOther)],["Strengths",all(S.strengths,S.strengthsOther)],["Areas to Improve",all(S.growth,S.growthOther)],["Five-Year Vision",all(S.vision,S.visionOther)],["Career",all(S.careerAreas,S.careerAreasOther).concat(S.careerChoice?[S.careerChoice]:[])],["Education & Training",all(S.training,S.trainingOther)],["Supports",all([...S.trainingHelp,...S.supports],S.trainingHelpOther||S.supportsOther)],["Independent Living",[...all(S.living,S.livingOther),...all(S.transport,S.transportOther),...all(S.money,S.moneyOther),...all(S.independent,S.independentOther)]]];return c.map(([h,a])=>`<div class="rcard"><h4>${esc(h)}</h4><p>${a.length?esc(a.join(", ")):"Nothing selected yet."}</p></div>`).join("")}
function forYear(y){return items().filter(o=>(S.timeline[o.id]||[]).includes(y))}
function summary(){return `<div class="review">${[1,2,3,4,5].map(y=>`<div class="rcard"><h4>Year ${y}</h4><p>${forYear(y).map(x=>esc(x.text)).join(", ")||"No items assigned yet."}</p></div>`).join("")}</div>`}
function yearPlan(y){let a=forYear(y);return `<div class="yplan"><h3>Year ${y} — ${Number(S.gradYear||new Date().getFullYear())+y-1}</h3><p class="hint">Ideas you selected:</p><div class="keys">${a.length?a.map(x=>`<span class="key">${esc(x.text)}</span>`).join(""):'<span class="hint">No ideas assigned yet.</span>'}</div><label><strong>Using the information above, explain your plan for this year in your own words.</strong></label><textarea class="plantext" data-write="${y-1}" placeholder="In Year ${y}, I plan to...">${esc(S.yearWriting[y-1])}</textarea></div>`}
function upload(k,l){return `<div class="upload"><strong>${esc(l)}</strong><input type="file" accept="image/*" data-image="${k}">${S.images[k]?`<img src="${S.images[k]}" alt="${esc(l)}"><button type="button" class="chip" data-remove="${k}">Remove</button>`:""}</div>`}
function bind(){$$("[data-step]").forEach(b=>b.onclick=()=>{cur=+b.dataset.step;save();render()});$$("[data-field]").forEach(x=>x.oninput=()=>{S[x.dataset.field]=x.value;save()});$$("[data-array]").forEach(x=>x.onchange=()=>{let p=x.dataset.array,v=$$(`[data-array="${CSS.escape(p)}"]:checked`).map(z=>z.value);if(p==="strengths"&&v.length>5){x.checked=false;flash("Please choose no more than five strengths.");v=$$(`[data-array="${CSS.escape(p)}"]:checked`).map(z=>z.value)}S[p]=v;save()});$$("[data-fill]").forEach(b=>b.onclick=()=>{S[b.dataset.fill]=b.dataset.text;save();render()});$$("[data-time]").forEach(x=>x.onchange=()=>{let id=x.dataset.time;S.timeline[id]=$$(`[data-time="${CSS.escape(id)}"]:checked`).map(z=>+z.value);save()});$$("[data-write]").forEach(x=>x.oninput=()=>{S.yearWriting[+x.dataset.write]=x.value;save()});$$('input[name="theme"]').forEach(x=>x.onchange=()=>{S.theme=x.value;save();render()});$$('input[name="dec"]').forEach(x=>x.onchange=()=>{S.decoration=x.value;save()});$$("[data-image]").forEach(x=>x.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{S.images[x.dataset.image]=r.result;save();render()};r.readAsDataURL(f)});$$("[data-remove]").forEach(b=>b.onclick=()=>{S.images[b.dataset.remove]="";save();render()});if($("#startHome"))$("#startHome").onclick=()=>{cur=1;save();render()};if($("#print"))$("#print").onclick=printPlan;if($("#html"))$("#html").onclick=downloadPlan;if($("#data"))$("#data").onclick=()=>blob(JSON.stringify(S,null,2),"application/json",base()+"_saved_answers.json")}
$("#back").onclick=()=>{if(cur>0){cur--;save();render()}};$("#next").onclick=()=>{if(cur<steps.length-1){cur++;save();render()}else flash("Your progress is saved.")};$("#reset").onclick=()=>{if(confirm("Clear all answers and start over?")){S=structuredClone(D);cur=0;localStorage.removeItem(STORE);render()}};
function deco(){return S.decoration==="stars"?"★ ✦ ★":S.decoration==="path"?"● ─── ● ─── ●":S.decoration==="confetti"?"◆ ● ▲ ✦ ◆":"—"}function img(k){return S.images[k]?`<img src="${S.images[k]}" style="max-width:220px;max-height:180px;border-radius:14px">`:""}
function finished(){return `<section class="print-page" style="text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center"><h1 style="font-size:42px;margin-bottom:18px">My Five-Year Plan</h1><h2 style="font-size:28px;margin:8px 0">${esc(S.studentName||"Student Name")}</h2><p style="font-size:18px">Expected graduation year: ${esc(S.gradYear)}</p>${img("headshot")}</section><section class="print-page"><h1 style="font-size:36px;color:var(--a)">My Personal Goals</h1><p style="font-size:20px;line-height:1.7">${esc(all(S.personalGoals,S.personalOther).join(" • ")||"Not selected")}</p><h2 style="color:var(--a)">Why These Goals Matter to Me</h2><p style="white-space:pre-wrap;line-height:1.65">${esc(S.personalWhy||"Not written yet.")}</p></section><section class="print-page"><h1>My Strengths & Growth</h1><h2>My Strengths</h2><p>${esc(all(S.strengths,S.strengthsOther).join(" • ")||"Not selected")}</p><h2>Areas I Want to Improve</h2><p>${esc(all(S.growth,S.growthOther).join(" • ")||"Not selected")}</p><h2>My Five-Year Vision</h2><p>${esc(all(S.vision,S.visionOther).join(" • ")||"Not selected")}</p></section><section class="print-page"><h1>Career & Training</h1>${img("career")}<h2>Career Areas</h2><p>${esc(all(S.careerAreas,S.careerAreasOther).join(" • ")||"Not selected")}</p><h2>Specific Job or Career</h2><p>${esc(S.careerChoice||"Not selected")}</p><h2>Education or Training</h2><p>${esc(all(S.training,S.trainingOther).join(" • ")||"Not selected")}</p><h2>Help I May Need</h2><p>${esc(all(S.trainingHelp,S.trainingHelpOther).join(" • ")||"Not selected")}</p></section>${[1,2,3,4,5].map(y=>`<section class="print-page"><h1>Year ${y} — ${Number(S.gradYear||new Date().getFullYear())+y-1}</h1>${img("year"+y)}<h2>My Ideas</h2><p>${esc(forYear(y).map(x=>x.text).join(" • ")||"No ideas assigned.")}</p><h2>My Plan</h2><p style="white-space:pre-wrap;line-height:1.65">${esc(S.yearWriting[y-1]||"Not written yet.")}</p></section>`).join("")}` }
function printPlan(){let w=open("","_blank");w.document.write(`<!doctype html><html><head><title>Five-Year Plan</title><style>${document.querySelector("style").textContent}body{background:white}.print-page{max-width:8.5in;margin:auto}h1{color:var(--a)}</style></head><body class="${S.theme}">${finished()}<script>onload=()=>print()<\/script></body></html>`);w.document.close()}
function downloadPlan(){let c=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(S.studentName)} Five-Year Plan</title><style>${document.querySelector("style").textContent}body{background:#eef2f7}.print-page{max-width:8.5in;margin:20px auto;background:white}</style></head><body class="${S.theme}"><div class="no-print" style="position:sticky;top:0;background:#172437;padding:12px;text-align:center"><button onclick="print()">Print / Save PDF</button></div>${finished()}</body></html>`;blob(c,"text/html",base()+"_five_year_plan.html")}
function blob(c,t,n){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function base(){return(S.studentName||"student").replace(/[^a-z0-9]+/gi,"_")}render();
</script></body></html>
